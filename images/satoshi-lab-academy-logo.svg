<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Satoshi Lab Academy">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC15A"/>
      <stop offset="0.55" stop-color="#FF9E2C"/>
      <stop offset="1" stop-color="#FF7A0F"/>
    </linearGradient>
    <linearGradient id="orangeL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF7A0F"/>
    </linearGradient>
  </defs>

  <!-- transparent background so it blends into the dark hero -->

  <!-- SL MONOGRAM -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900">
    <text x="700" y="560" text-anchor="middle" font-size="470"
          fill="#ffffff" letter-spacing="-10" font-style="italic">S</text>
    <text x="880" y="575" text-anchor="middle" font-size="470"
          fill="url(#orangeL)" font-style="italic">L</text>
  </g>

  <!-- pixel dispersion, upper-right of the monogram -->
  <g fill="url(#orange)">
    <rect x="905"  y="210" width="34" height="34" rx="4" opacity="0.55"/>
    <rect x="952"  y="188" width="30" height="30" rx="4" opacity="0.8"/>
    <rect x="944"  y="238" width="40" height="40" rx="4"/>
    <rect x="994"  y="224" width="26" height="26" rx="3" opacity="0.7"/>
    <rect x="986"  y="272" width="34" height="34" rx="4" opacity="0.9"/>
    <rect x="1028" y="256" width="20" height="20" rx="3" opacity="0.5"/>
    <rect x="922"  y="286" width="26" height="26" rx="3" opacity="0.65"/>
  </g>

  <!-- SATOSHI LAB wordmark -->
  <text x="768" y="740" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="152" letter-spacing="6">
    <tspan fill="#ffffff">SATOSHI </tspan><tspan fill="url(#orange)">LAB</tspan>
  </text>

  <!-- ACADEMY with flanking rules -->
  <g>
    <rect x="330" y="812" width="150" height="5" rx="2.5" fill="#c9d0dc"/>
    <rect x="492" y="810" width="16" height="9" rx="2" fill="url(#orange)"/>
    <rect x="1028" y="810" width="16" height="9" rx="2" fill="url(#orange)"/>
    <rect x="1056" y="812" width="150" height="5" rx="2.5" fill="#c9d0dc"/>
    <text x="768" y="848" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="700"
          font-size="92" letter-spacing="30" fill="#cbd2dc">ACADEMY</text>
  </g>
</svg>
